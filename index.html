.set.done .setdone{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.done input{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.flag{grid-column:2 / 4;font-size:.78rem;font-weight:700;margin-top:-4px}

function defaults(){return{
  settings:{name:'Level Up',theme:'dark',accent:'lime',size:'m',corners:'round',motion:true,quote:true,units:'lb',rest:120,bottle:16,waterGoal:5,
    schedule:{0:'rest',1:'push1',2:'pull1',3:'legs1',4:'rest',5:'upper',6:'legs2'},abs:[1,3,5]},
  sessions:[],water:{},meals:{},habits:{},active:null}}
function load(){
  const d=defaults();
  try{const raw=localStorage.getItem(LS);if(raw){const p=JSON.parse(raw);
    return {...d,...p,settings:{...d.settings,...(p.settings||{}),schedule:{...d.settings.schedule,...((p.settings||{}).schedule||{})}}};}}catch(e){}
  return d;
}
let S=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const ui={tab:'home',detail:null,logger:false,settings:false,week:0,confirm:null,backup:false};

const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const weekStart=(off=0)=>{const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7)+off*7);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtD=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtT=ts=>new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${pad(s%60)}`};
const wid=dow=>W[S.settings.schedule[dow]]?S.settings.schedule[dow]:'rest';
function exercisesFor(dow,id=wid(dow)){
  if(id==='rest')return [];
  return W[id].ex.concat(S.settings.abs.includes(dow)?ABS:[]);
}
const totalSets=ex=>ex.reduce((a,e)=>a+e.sets,0);
const estMin=ex=>Math.max(5,Math.round(totalSets(ex)*2.6/5)*5);
function lastFor(name){
  for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i].entries[name];if(s&&s.length)return {date:S.sessions[i].date,sets:s}}
  return null;
}
function bestFor(name){
  let b=null;S.sessions.forEach(s=>(s.entries[name]||[]).forEach(x=>{if(!b||x.w>b.w||(x.w===b.w&&x.r>b.r))b={...x,date:s.date}}));return b;
}
const setTxt=x=>`${x.w}×${x.r}`;
function compare(v,L){
  if(!L||v.w===''||v.r==='')return null;
  const w=+v.w,r=+v.r;
  if(w>L.w||(w===L.w&&r>L.r))return 'beat';
  if(w===L.w&&r===L.r)return 'match';
  return 'below';
}
const FLAG={beat:'▲ Beat last time',match:'= Matched last time',below:'Below last time'};
const todayWater=()=>(S.water[dkey()]||[]);
const todayMeals=()=>(S.meals[dkey()]||{});
const todayHabits=()=>(S.habits[dkey()]||{});
function ring(v,max,size=64,stroke=6){
  const r=(size-stroke)/2,c=2*Math.PI*r,p=max?Math.min(1,v/max):0;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}"/><circle class="bar" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg>`;
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

function applyLook(){
  const s=S.settings,h=document.documentElement;
  h.classList.remove('t-dark','t-black','t-light','fs-s','fs-l','c-soft','c-sharp','no-motion');
  if(s.theme!=='system')h.classList.add('t-'+s.theme);
  if(s.size!=='m')h.classList.add('fs-'+s.size);
  if(s.corners!=='round')h.classList.add('c-'+s.corners);
  if(!s.motion)h.classList.add('no-motion');
  const a=ACCENTS[s.accent]||ACCENTS.lime;
  h.style.setProperty('--a-fill',a.f);h.style.setProperty('--a-ink',a.i);h.style.setProperty('--a-dk',a.f);h.style.setProperty('--a-lt',a.lt);
  document.title=s.name||'Level Up';
}
const gearBtn=()=>`<button class="iconbtn" data-act="settings" aria-label="Settings">${svg('gear')}</button>`;

      ${doneToday?`<div class="pill">${svg('check')} Done today</div>`:`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn play" data-act="start" data-dow="${dow}">${svg('play')} ${S.active?'Resume':'Start workout'}</button><button class="btn ghost" data-act="detail" data-dow="${dow}">View plan</button></div>`}</div>`;
  return `<header class="top"><div><div class="brand">${svg('peak')}${esc(S.settings.name)}</div><div class="tagline">Better habits. Stronger you.</div></div>${gearBtn()}</header>
  ${banner}${hero}
  <section class="card"><div class="card-h"><div><div class="card-t">Today</div><div class="sub">${DAYS[dow]}, ${fmtD(now)}</div></div><span class="pill num">${hc}/5 habits</span></div>
    <div class="list">${HABITS.map((t,i)=>`<button class="check-row ${h[i]?'on':''}" data-act="habit" data-i="${i}"><span class="box">${svg('check')}</span><span class="lbl">${t}</span></button>`).join('')}</div></section>
  <section class="card"><div class="card-t">This week</div><div class="week">${wk}</div></section>
  <div class="tiles">
    <button class="tile" data-act="tab" data-tab="workouts">${svg('dumbbell')}<span class="k">Next workout</span><span class="v word">${nextD!=null?esc(W[wid(nextD)].name):'—'}</span><span class="k">${nextD!=null?DAYS[nextD]:''}</span></button>
    <button class="tile" data-act="water-add">${svg('drop')}<span class="k">Water today</span><span class="v num">${water}<small>/${S.settings.waterGoal}</small></span><span class="k">Tap to add</span></button>
    <button class="tile" data-act="tab" data-tab="food">${svg('food')}<span class="k">Meals today</span><span class="v num">${meals}<small>/4</small></span><span class="k">completed</span></button>
  </div>
  ${S.settings.quote?`<div class="quote">${QUOTES[now.getDate()%QUOTES.length]}</div>`:''}`;
}

function vWorkouts(){
  if(ui.detail!=null)return vDetail(ui.detail);
  const today=new Date().getDay();
  const rows=MON_FIRST.map(d=>{const id=wid(d),w=W[id],ex=exercisesFor(d);

  <section class="card"><div class="card-t">What actually works</div><div class="rules">${PRINCIPLES.map(p=>`<div class="rule">${svg('check')}<div><b>${p[0]}</b><div class="sub">${p[1]}</div></div></div>`).join('')}</div></section>`;

function vDetail(dow){
  const id=wid(dow),w=W[id],ex=exercisesFor(dow);
  const list=ex.map((e,i)=>{const L=lastFor(e.n);
    return `<div class="ex"><div class="n">${i+1}</div><div style="min-width:0"><div class="t">${esc(e.n)}</div><div class="s">${e.sets} × ${e.reps} reps · to failure</div><div class="last">${L?`Last (${fmtD(fromKey(L.date))}): <b class="num">${L.sets.map(setTxt).join(' · ')}</b>`:'No log yet. Set your baseline.'}</div></div></div>`}).join('');
  return `<div class="sheet-top"><button class="iconbtn" data-act="detail-close" aria-label="Back">${svg('back')}</button><div class="grow"><div class="t">${DAYS[dow]} – ${esc(w.name)}</div><div class="sub">${esc(w.sub)}</div></div></div>
  <div class="card hero">${svg(id==='rest'?'moon':'dumbbell','bg-ic')}<div class="big">${esc(w.name)}</div><div class="meta num">${id==='rest'?'Recovery':`${esc(w.focus)} · ~${estMin(ex)} min`}</div></div>

function vProgress(){
  const ws=weekStart(ui.week),we=addDays(ws,6),keys=[...Array(7)].map((_,i)=>dkey(addDays(ws,i)));
  const sess=S.sessions.filter(s=>keys.includes(s.date));
  const planned=MON_FIRST.filter(d=>wid(d)!=='rest').length;
  const wDone=new Set(sess.map(s=>s.date)).size;
  const hab=keys.reduce((a,k)=>a+Object.values(S.habits[k]||{}).filter(Boolean).length,0);
  const wat=keys.filter(k=>(S.water[k]||[]).length>=S.settings.waterGoal).length;
  const mea=keys.filter(k=>MEALS.every(m=>(S.meals[k]||{})[m[0]])).length;
  const beats=sess.reduce((a,s)=>a+(s.beats||0),0);
  const R=(k,v,max)=>`<div class="ring">${ring(v,max)}<div><div class="k">${k}</div><div class="v num">${v}<span class="sub" style="font-size:.95rem">/${max}</span></div></div></div>`;
  const G=(k,v,max)=>`<div class="goal"><div class="gl"><span>${k}</span><span class="num sub">${v}/${max}</span></div><div class="bar-h"><i style="width:${max?Math.min(100,v/max*100):0}%"></i></div></div>`;

        <div class="field"><input type="number" inputmode="decimal" id="w-${ei}-${si}" data-set="${ei},${si},w" value="${esc(v.w)}" placeholder="${Ls?Ls.w:'0'}" aria-label="Weight, set ${si+1}"><span class="u">${S.settings.units}</span></div>
        <div class="field"><input type="number" inputmode="numeric" id="r-${ei}-${si}" data-set="${ei},${si},r" value="${esc(v.r)}" placeholder="${Ls?Ls.r:e.reps.split('–')[0]}" aria-label="Reps, set ${si+1}"><span class="u">reps</span></div>
        <button class="setdone" data-act="set-done" data-ei="${ei}" data-si="${si}" aria-label="Mark set ${si+1} done">${svg('check')}</button>
        <div class="flag ${f||''}" id="flag-${ei}-${si}">${f?FLAG[f]:''}</div></div>`}).join('');
    return `<div class="lcard"><div class="lhead"><div class="t">${ei+1}. ${esc(e.n)}</div><div class="sub">${e.sets} × ${e.reps} reps · to failure</div><div class="last">${L?`Beat this: <b class="num">${L.sets.map(setTxt).join(' · ')}</b>`:'First time. Set a baseline.'}</div></div>
      <div class="sets"><div class="set set-h"><span>Set</span><span>Weight</span><span>Reps</span><span></span></div>${rows}</div></div>`}).join('');
  return `<div class="sheet fade-in" id="sheet"><div class="sheet-in">
    <div class="sheet-top"><button class="iconbtn" data-act="close-logger" aria-label="Minimize">${svg('back')}</button><div class="grow"><div class="t">${esc(w.name)}</div><div class="sub num"><span id="elapsed">${mmss((Date.now()-a.start)/1000)}</span> elapsed</div></div><button class="btn" data-act="finish">Finish</button></div>
    ${cards}
    <button class="btn block ${ui.confirm==='discard'?'danger':'ghost'}" data-act="discard">${ui.confirm==='discard'?'Tap again to discard workout':'Discard workout'}</button>
  </div></div>
  <div class="restbar" hidden id="restbar"><div class="restbar-in">${svg('timer','lg')}<div style="flex:1;min-width:0"><div class="sub">Rest</div><div class="time num" id="rest-time">0:00</div><div class="prog"><i id="rest-prog"></i></div></div><button class="small-btn" data-act="rest-add" data-s="-15">−15</button><button class="small-btn" data-act="rest-add" data-s="15">+15</button><button class="small-btn" data-act="rest-skip">Skip</button></div></div>`;
}

function vSettings(){
  const s=S.settings;
  const seg=(k,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button class="${String(s[k])===String(v)?'on':''}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const tog=(k,l,d)=>`<button class="switch" data-act="toggle" data-k="${k}"><span><span class="ol">${l}</span>${d?`<div class="sub">${d}</div>`:''}</span><span class="tog ${s[k]?'on':''}"></span></button>`;
  const sched=MON_FIRST.map(d=>`<label class="sub" for="sch-${d}">${D3[d]}</label><select id="sch-${d}" data-sched="${d}">${W_ORDER.map(id=>`<option value="${id}" ${wid(d)===id?'selected':''}>${W[id].name}${id==='rest'?'':' · '+W[id].sub}</option>`).join('')}</select>`).join('');
  return `<div class="sheet fade-in" id="sheet"><div class="sheet-in">
  <div class="sheet-top"><button class="iconbtn" data-act="settings-close" aria-label="Close settings">${svg('back')}</button><div class="grow"><div class="t">Settings</div><div class="sub">Make it yours.</div></div></div>
  <section class="card set-sec"><h3>Appearance</h3>
    <div class="opt"><span class="ol">Theme</span>${seg('theme',[['dark','Dark'],['black','Black'],['light','Light'],['system','System']])}</div>
    <div class="opt"><span class="ol">Accent color</span><div class="swatches">${Object.entries(ACCENTS).map(([k,a])=>`<button class="sw ${s.accent===k?'on':''}" style="background:${a.f};color:${a.i}" data-act="set" data-k="accent" data-v="${k}" aria-label="${a.n}">${svg('check')}</button>`).join('')}</div></div>
    <div class="opt"><span class="ol">Text size</span>${seg('size',[['s','Small'],['m','Medium'],['l','Large']])}</div>
    <div class="opt"><span class="ol">Corners</span>${seg('corners',[['round','Round'],['soft','Soft'],['sharp','Sharp']])}</div>
    ${tog('motion','Animations','Transitions and ring fills')}
    ${tog('quote','Daily quote','Motivation line on Home')}
    <div class="opt"><label class="ol" for="appname">App name</label><input class="textin" id="appname" maxlength="18" value="${esc(s.name)}"></div>
  </section>
  <section class="card set-sec"><h3>Training</h3>
    <div class="opt"><span class="ol">Weight units</span>${seg('units',[['lb','lb'],['kg','kg']])}</div>
    <div class="opt"><span class="ol">Rest timer</span>${seg('rest',[[60,'1:00'],[90,'1:30'],[120,'2:00'],[180,'3:00']])}</div>
    <div class="opt"><span class="ol">Weekly schedule</span><div class="sched">${sched}</div></div>
    <div class="opt"><span class="ol">Abs days</span><div class="chips">${MON_FIRST.map(d=>`<button class="chip ${s.abs.includes(d)?'on':''}" data-act="abs" data-d="${d}">${D3[d]}</button>`).join('')}</div><div class="sub">Adds Hanging Leg Raises and Cable Crunches on training days.</div></div>
  </section>
  <section class="card set-sec"><h3>Hydration</h3>
    <div class="opt"><span class="ol">Bottle size</span>${seg('bottle',[[12,'12 oz'],[16,'16 oz'],[20,'20 oz'],[24,'24'],[32,'32']])}</div>
    <div class="opt"><span class="ol">Daily goal</span><div class="stepper"><button class="iconbtn" data-act="goal" data-d="-1" aria-label="Fewer bottles">${svg('minus')}</button><span class="v num">${s.waterGoal}</span><button class="iconbtn" data-act="goal" data-d="1" aria-label="More bottles">${svg('plus')}</button><span class="sub">bottles</span></div></div>
  </section>
  <section class="card set-sec"><h3>Your data</h3>
    <div class="sub">Everything saves on this phone. Copy a backup into Notes now and then so you never lose your logbook.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="backup-copy">Copy backup</button><button class="btn ghost" data-act="backup-toggle">Restore backup</button></div>
    <div ${ui.backup?'':'hidden'} class="stack"><textarea id="restore" placeholder="Paste a backup here"></textarea><button class="btn" data-act="backup-restore">Restore</button></div>
    <button class="btn ${ui.confirm==='reset'?'danger':'ghost'}" data-act="reset">${ui.confirm==='reset'?'Tap again to erase logs':'Reset all logs'}</button>
  </section>
  </div></div>`;
}

const VIEWS={home:vHome,workouts:vWorkouts,water:vWater,food:vFood,progress:vProgress};
const TABS=[['home','Home','home'],['workouts','Workouts','dumbbell'],['water','Hydration','drop'],['food','Nutrition','food'],['progress','Progress','chart']];
const root=document.getElementById('root');
function render(){
  applyLook();
  const y=window.scrollY;
  const old=document.getElementById('sheet'),oldScroll=old?old.scrollTop:0,oldKind=old?old.dataset.kind:null;
  let html=`<main class="app">${VIEWS[ui.tab]()}</main>
  <nav class="tabbar" aria-label="Sections"><div class="tabbar-in">${TABS.map(([k,l,ic])=>`<button class="tab ${ui.tab===k?'on':''}" data-act="tab" data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${svg(ic)}${l}</button>`).join('')}</div></nav>`;
  let kind=null;
  if(ui.settings){html+=vSettings();kind='settings'}
  else if(ui.logger&&S.active){html+=vLogger();kind='logger'}
  root.innerHTML=html;
  const ns=document.getElementById('sheet');
  if(ns){ns.dataset.kind=kind;if(kind===oldKind){ns.scrollTop=oldScroll;ns.classList.remove('fade-in')}}
  document.body.style.overflow=kind?'hidden':'';
  window.scrollTo(0,y);
  tick();
}

function startWorkout(dow){
  if(!S.active){
    const id=wid(dow);
    S.active={id,dow,start:Date.now(),date:dkey(),entries:exercisesFor(dow,id).map(e=>({n:e.n,reps:e.reps,sets:Array.from({length:e.sets},()=>({w:'',r:'',done:false}))}))};
    save();
  }
  ui.logger=true;ui.confirm=null;render();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wake=l).catch(()=>{})}catch(e){}
}
function finishWorkout(){
  const a=S.active,entries={};let beats=0,count=0;
  a.entries.forEach(e=>{const L=lastFor(e.n);
    const sets=[];e.sets.forEach((v,i)=>{if(v.w!==''&&v.r!==''){if(compare(v,L&&L.sets[i])==='beat')beats++;sets.push({w:+v.w,r:+v.r})}});
    if(sets.length){entries[e.n]=sets;count+=sets.length}});
  if(!count){toast('Log at least one set with weight and reps to save.');return}
  S.sessions.push({id:Date.now().toString(36),date:a.date,dow:a.dow,wid:a.id,name:W[a.id].name,start:a.start,end:Date.now(),entries,beats});
  const h=S.habits[a.date]||(S.habits[a.date]={});h[2]=true;
  S.active=null;ui.logger=false;rest.end=0;save();
  try{wake&&wake.release()}catch(e){}
  ui.tab='progress';ui.week=0;render();window.scrollTo(0,0);
  toast(beats?`Workout saved. Beat the logbook ${beats} time${beats>1?'s':''}.`:'Workout saved');
}
function beep(){
  try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=880;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(audio.destination);o.start();o.stop(t+.55)}catch(e){}
}
function tick(){
  const el=document.getElementById('elapsed');if(el&&S.active)el.textContent=mmss((Date.now()-S.active.start)/1000);
  const bar=document.getElementById('restbar');if(!bar)return;
  if(!rest.end){bar.hidden=true;return}
  const left=(rest.end-Date.now())/1000;
  if(left<=0){rest.end=0;bar.hidden=true;beep();toast('Rest over. Next set.');return}
  bar.hidden=false;
  document.getElementById('rest-time').textContent=mmss(left);
  document.getElementById('rest-prog').style.width=Math.min(100,100*(1-left/rest.total))+'%';
}
setInterval(tick,250);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,s=S.settings;
  if(act!=='discard'&&act!=='reset')ui.confirm=null;
  switch(act){
    case 'tab':ui.tab=b.dataset.tab;ui.detail=null;render();window.scrollTo(0,0);break;
    case 'settings':ui.settings=true;render();break;
    case 'settings-close':ui.settings=false;ui.backup=false;render();break;
    case 'habit':{const h=S.habits[dkey()]||(S.habits[dkey()]={});h[b.dataset.i]=!h[b.dataset.i];save();render();break}
    case 'meal':{const m=S.meals[dkey()]||(S.meals[dkey()]={});m[b.dataset.k]=!m[b.dataset.k];save();render();break}
    case 'water-add':(S.water[dkey()]||(S.water[dkey()]=[])).push(Date.now());save();render();toast(`Logged ${s.bottle} oz`);break;
    case 'water-del':todayWater().splice(+b.dataset.i,1);save();render();break;
    case 'detail':ui.tab='workouts';ui.detail=+b.dataset.dow;render();window.scrollTo(0,0);break;
    case 'detail-close':ui.detail=null;render();break;
    case 'start':
      if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}}
      startWorkout(+b.dataset.dow);break;
    case 'open-logger':ui.logger=true;render();break;
    case 'close-logger':ui.logger=false;render();break;
    case 'set-done':{const v=S.active.entries[+b.dataset.ei].sets[+b.dataset.si];v.done=!v.done;
      if(v.done){try{audio&&audio.state==='suspended'&&audio.resume()}catch(err){}rest.total=s.rest;rest.end=Date.now()+s.rest*1000}
      save();render();break}
    case 'rest-add':if(rest.end){rest.end+=(+b.dataset.s)*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);tick()}break;
    case 'rest-skip':rest.end=0;tick();break;
    case 'finish':finishWorkout();break;
    case 'discard':if(ui.confirm==='discard'){S.active=null;ui.logger=false;ui.confirm=null;rest.end=0;save();render();toast('Workout discarded')}else{ui.confirm='discard';render()}break;
    case 'week':ui.week=Math.min(0,ui.week+(+b.dataset.d));render();break;
    case 'set':{let v=b.dataset.v;if(b.dataset.k==='rest'||b.dataset.k==='bottle')v=+v;s[b.dataset.k]=v;save();render();break}
    case 'toggle':s[b.dataset.k]=!s[b.dataset.k];save();render();break;
    case 'abs':{const d=+b.dataset.d;s.abs=s.abs.includes(d)?s.abs.filter(x=>x!==d):s.abs.concat(d);save();render();break}
    case 'goal':s.waterGoal=Math.min(12,Math.max(1,s.waterGoal+(+b.dataset.d)));save();render();break;
    case 'backup-copy':{const txt=JSON.stringify(S);
      const fallback=()=>{ui.backup=true;render();const t=document.getElementById('restore');t.value=txt;t.focus();t.select();toast('Select all and copy this text')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied. Paste it in Notes to keep it.'),fallback)}catch(err){fallback()}break}
    case 'backup-toggle':ui.backup=!ui.backup;render();break;
    case 'backup-restore':{try{const p=JSON.parse(document.getElementById('restore').value);if(!p||!p.settings||!Array.isArray(p.sessions))throw 0;
      localStorage.setItem(LS,JSON.stringify(p));S=load();ui.backup=false;render();toast('Backup restored')}catch(err){toast('That isn’t a full backup. Paste the whole copied text and try again.')}break}
    case 'reset':if(ui.confirm==='reset'){const keep=S.settings;S=defaults();S.settings=keep;ui.confirm=null;save();render();toast('Logs erased. Settings kept.')}else{ui.confirm='reset';render()}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.set&&S.active){const [ei,si,f]=t.dataset.set.split(',');const v=S.active.entries[+ei].sets[+si];v[f]=t.value;save();
    const L=lastFor(S.active.entries[+ei].n),r=compare(v,L&&L.sets[+si]),fl=document.getElementById(`flag-${ei}-${si}`);
    if(fl){fl.className='flag '+(r||'');fl.textContent=r?FLAG[r]:''}}
  if(t.id==='appname'){S.settings.name=t.value.trim()||'Level Up';save();document.title=S.settings.name}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sched){S.settings.schedule[t.dataset.sched]=t.value;save();render()}
  if(t.id==='appname')render();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.activeElement.matches('input,textarea'))render()});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
