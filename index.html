<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Level Up">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: one-column phone app (max 480px), fixed bottom tab bar, stacked full-screen sheets */
/* Look: "clean pro" — true black, neutral Apple-style grays, crisp white type, one bright accent */
:root{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --edge:transparent; --fg:#FFFFFF; --muted:#8E8E93;
  --good:#30D158; --warn:#FFD60A; --bad:#FF453A; --carb:#64D2FF; --fat:#FF9F0A;
  --a-fill:#B8F55A; --a-ink:#0E1A05; --a-dk:#B8F55A; --a-lt:#3F7A0C;
  --accent:var(--a-fill); --accent-ink:var(--a-ink); --accent-fg:var(--a-dk);
  --r:20px; --r-sm:12px;
  --font-d:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-b:system-ui,-apple-system,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#E9E9EE;--line:#D1D1D6;--edge:rgba(0,0,0,.05);--fg:#000000;--muted:#6C6C70;--accent-fg:var(--a-lt);--carb:#0A84FF;--fat:#C76A00;color-scheme:light}
}
:root[data-theme="light"]{--bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#E9E9EE;--line:#D1D1D6;--edge:rgba(0,0,0,.05);--fg:#000000;--muted:#6C6C70;--accent-fg:var(--a-lt);--carb:#0A84FF;--fat:#C76A00;color-scheme:light}
html:root.t-black{--bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--line:#38383A;--edge:transparent;--fg:#FFFFFF;--muted:#8E8E93;--accent-fg:var(--a-dk);--carb:#64D2FF;--fat:#FF9F0A;color-scheme:dark}
html:root.t-dark{--bg:#121214;--surface:#1F1F23;--surface-2:#2B2B30;--line:#3A3A40;--edge:rgba(255,255,255,.04);--fg:#F5F5F7;--muted:#8E8E93;--accent-fg:var(--a-dk);--carb:#64D2FF;--fat:#FF9F0A;color-scheme:dark}
html:root.t-light{--bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#E9E9EE;--line:#D1D1D6;--edge:rgba(0,0,0,.05);--fg:#000000;--muted:#6C6C70;--accent-fg:var(--a-lt);--carb:#0A84FF;--fat:#C76A00;color-scheme:light}
html{font-size:16px;padding-top:env(safe-area-inset-top,0px)}
html.fs-s{font-size:14.5px} html.fs-l{font-size:18px}
html.c-soft{--r:13px;--r-sm:9px} html.c-sharp{--r:4px;--r-sm:3px}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:1rem;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{width:1.25rem;height:1.25rem;flex:none}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(6.5rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top-r{display:flex;gap:8px;align-items:center}
.brand{font-family:var(--font-d);font-weight:800;font-size:1.75rem;letter-spacing:-.01em;line-height:1;color:var(--fg);display:flex;align-items:center;gap:10px}
.brand .mark{width:2.1rem;height:2.1rem;flex:none}
.tagline{color:var(--muted);font-size:.9rem;margin-top:4px}
.h1{font-family:var(--font-d);font-weight:800;font-size:2rem;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:10px}
.h1 .ic{color:var(--accent-fg);width:1.6rem;height:1.6rem}
.sub{color:var(--muted);font-size:.9rem}
.tiny{font-size:.78rem;color:var(--muted)}
.iconbtn{width:2.6rem;height:2.6rem;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--edge);color:var(--fg);flex:none}
.iconbtn.sm{width:2.2rem;height:2.2rem}
.iconbtn.sm .ic{width:1.05rem;height:1.05rem}
.streak{display:inline-flex;align-items:center;gap:4px;height:2.6rem;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--edge);font-weight:700;font-family:var(--font-d);font-size:1.2rem}
.streak .ic{color:#FF9F0A}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-t{font-weight:700;font-size:1.08rem;letter-spacing:-.01em}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:.8rem;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-fg);align-self:flex-start;white-space:nowrap}
.pill .ic{width:.95rem;height:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem}
.btn.block{width:100%}
.btn.sm{min-height:2.4rem;padding:0 14px;font-size:.9rem}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--edge)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.btn .ic{width:1.1rem;height:1.1rem}
.btn.play .ic{fill:currentColor}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;background:var(--surface)}
.hero .big{font-family:var(--font-d);font-weight:800;font-size:2.7rem;line-height:1;letter-spacing:-.02em}
.hero .meta{color:var(--accent-fg);font-weight:600;font-size:.9rem}
.hero .bg-ic{position:absolute;right:-12px;bottom:-18px;width:9rem;height:9rem;color:var(--accent);opacity:.08;pointer-events:none}
.list{display:flex;flex-direction:column;gap:2px}
.check-row{display:flex;align-items:center;gap:12px;padding:8px 0;text-align:left;width:100%}
.box{width:1.45rem;height:1.45rem;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.box .ic{width:1rem;height:1rem;opacity:0}
.on>.box,.on .box{background:var(--accent);border-color:var(--accent)}
.on>.box .ic,.on .box .ic{opacity:1}
.on .lbl{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);width:100%;text-align:left}
.tile-ic{width:2.8rem;height:2.8rem;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface-2);color:var(--accent-fg);flex:none}
.grow{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{color:var(--muted);font-size:.85rem}
.row.today{border-color:var(--accent)}
.chev{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dot{width:2.1rem;height:2.1rem;margin:0 auto 4px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:2px solid transparent}
.dot .ic{width:1rem;height:1rem}
.dot.done{background:var(--accent);color:var(--accent-ink)}
.dot.today{border-color:var(--accent)}
.dot.rest{background:transparent;border:2px dashed var(--line)}
.dot.rest.today{border-color:var(--accent)}
.wd{font-size:.72rem;color:var(--muted);font-weight:600}
.quote{text-align:center;color:var(--muted);font-family:var(--font-d);font-weight:700;font-size:1.1rem;padding:6px 0;text-wrap:balance}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;border:1px solid var(--edge);flex-wrap:wrap}
.seg button{flex:1;min-height:2.3rem;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{min-height:2.2rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--edge);font-weight:600;font-size:.85rem;padding:0 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .ic{width:1rem;height:1rem}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);text-align:left;width:100%}
.ex .n{font-family:var(--font-d);font-weight:700;font-size:1.5rem;color:var(--accent-fg);width:1.6rem;line-height:1;flex:none}
.ex .t{font-weight:700}
.ex .s{color:var(--muted);font-size:.85rem}
.last{font-size:.82rem;color:var(--muted);margin-top:4px}
.last b{color:var(--fg);font-weight:600}
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:flex;gap:10px;align-items:flex-start}
.rule .ic{color:var(--accent-fg);margin-top:1px}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-in{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(8rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-top{display:flex;align-items:center;gap:10px}
.sheet-top .t{font-family:var(--font-d);font-weight:800;letter-spacing:-.01em;font-size:1.5rem;line-height:1.05}
.fade-in{animation:fi .22s ease-out}
@keyframes fi{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
/* logger */
.lcard{background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.lcard.complete{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.lhead{display:flex;gap:8px;align-items:flex-start}
.lhead .t{font-weight:700;font-size:1.05rem}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:2rem 1fr 1fr 2.8rem;gap:8px;align-items:center}
.set-h{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.set .sn{font-family:var(--font-d);font-weight:700;font-size:1.2rem;text-align:center;color:var(--muted)}
.set.wu .sn{font-size:.8rem}
.set.wu .wtxt{grid-column:2 / 4;font-weight:600;color:var(--muted);font-size:.95rem}
.field{position:relative;min-width:0}
.field input,.inp{width:100%;min-height:2.8rem;border-radius:var(--r-sm);border:1px solid var(--edge);background:var(--surface-2);padding:0 10px;font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;min-width:0}
.field input{padding-right:2.4rem}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input::placeholder,.inp::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.field .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--muted);pointer-events:none}
.setdone{width:2.8rem;height:2.8rem;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--edge);color:var(--muted)}
.set.done .setdone{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.done input{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.set.pop .setdone{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.flag{grid-column:2 / 4;font-size:.78rem;font-weight:700;margin-top:-4px}
.flag:empty{display:none}
.flag.beat{color:var(--good)} .flag.match{color:var(--warn)} .flag.below{color:var(--muted)} .flag.pr{color:#FFB547}
.logtop{display:flex;align-items:center;gap:12px}
.pring{position:relative;width:3.4rem;height:3.4rem;flex:none}
.pring svg{width:100%;height:100%}
.pring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:.95rem}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.restbar-in{max-width:448px;margin:0 auto;display:flex;align-items:center;gap:10px}
.restbar .time{font-family:var(--font-d);font-weight:700;font-size:2rem;line-height:1}
.restbar .ic.lg{width:1.8rem;height:1.8rem;color:var(--accent-fg)}
.prog{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.small-btn{min-height:2.4rem;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--edge);font-weight:700;font-size:.85rem;white-space:nowrap}
/* rings & bars */
.rings{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rings.four{grid-template-columns:repeat(4,1fr);gap:6px}
.ring{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.ring svg{width:3.6rem;height:3.6rem;flex:none}
.ring .k{font-size:.8rem;color:var(--muted)}
.ring .v{font-family:var(--font-d);font-weight:700;font-size:1.5rem;line-height:1}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.mini .rw{position:relative;width:3.8rem;height:3.8rem}
.mini svg{width:100%;height:100%}
.mini .rw .ic{position:absolute;inset:0;margin:auto;color:var(--accent-fg)}
.mini .v{font-family:var(--font-d);font-weight:700;font-size:1.05rem;line-height:1}
.mini .k{font-size:.7rem;color:var(--muted)}
svg circle.trk{fill:none;stroke:var(--line)}
svg circle.bar{fill:none;stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
.bigring{display:grid;place-items:center;position:relative;padding:4px 0}
.bigring svg{width:12rem;height:12rem;max-width:100%}
.bigring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.bigring .v{font-family:var(--font-d);font-weight:800;font-size:2.6rem;line-height:1}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .gl{display:flex;justify-content:space-between;font-size:.88rem;gap:8px}
.bar-h{height:7px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .5s}
.bar-h.carb i{background:var(--carb)} .bar-h.fat i{background:var(--fat)}
.bar-h.over i{background:var(--bad)}
.logrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logrow .ic{color:var(--accent-fg)}
.tiny-x{width:2rem;height:2rem;border-radius:999px;display:grid;place-items:center;color:var(--muted);flex:none}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:center}
.hist:last-child{border-bottom:0}
.hist .t{font-weight:700}
.hist .s{color:var(--muted);font-size:.85rem}
.hist .r{text-align:right;flex:none}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .c{text-align:center}
.weeknav .c b{display:block;font-family:var(--font-d);font-size:1.3rem}
.empty-note{color:var(--muted);font-size:.9rem;text-align:center;padding:10px 0}
/* level */
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.badge{width:3.4rem;height:3.9rem;flex:none}
.badge.lg{width:7rem;height:8rem}
.badge text{font-family:var(--font-d);font-weight:800}
.lvl .ln{font-family:var(--font-d);font-weight:800;font-size:1.5rem;line-height:1}
.lvl .rk{font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.xpbar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stk{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.stk .v{font-family:var(--font-d);font-weight:800;font-size:1.8rem;line-height:1;display:flex;align-items:center;gap:6px}
.stk .v .ic{color:#FF9F0A;width:1.4rem;height:1.4rem}
/* muscle map */
.map svg{width:100%;height:auto;display:block}
.map .mus{stroke:var(--surface);stroke-width:1.6;transition:fill .5s;cursor:pointer}
.map .mus.sel{stroke:var(--fg);stroke-width:2.5}
.map .neu{fill:var(--line)}
.map .abl{stroke:var(--surface);stroke-width:1.2;fill:none;pointer-events:none}
.map text{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em}
.legend{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.legend i{flex:1;height:8px;border-radius:8px;background:linear-gradient(90deg,#34D27B,#F5C043,#F0465A)}
.mapinfo{min-height:2.6rem;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.9rem}
.mapinfo b{font-weight:700}
.sw-dot{display:inline-block;width:.7rem;height:.7rem;border-radius:999px;margin-right:6px;vertical-align:middle}
/* calendar */
.cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.cal i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);display:block}
.cal i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}
.cal i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--surface-2))}
.cal i.l3{background:var(--accent)}
.cal i.fut{background:transparent}
.cal i.now{outline:2px solid var(--fg);outline-offset:-1px}
.cal-l{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-avg{stroke:var(--fg);fill:none;stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}
.ch-area{fill:var(--accent);opacity:.14}
.ch-dot{fill:var(--accent)}
.ch-end{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.ch-txt{fill:var(--muted);font-size:10px;font-family:var(--font-b)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px}
.stat .k{font-size:.72rem;color:var(--muted)}
.stat .v{font-family:var(--font-d);font-weight:700;font-size:1.35rem;line-height:1.1}
/* food */
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-h .t{font-weight:700}
.fitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fitem .nm{font-weight:600;font-size:.95rem}
.fitem .kc{font-family:var(--font-d);font-weight:700;font-size:1.1rem;text-align:right}
.res{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--edge);width:100%;text-align:left}
.res .nm{font-weight:600}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macros div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 4px}
.macros b{display:block;font-family:var(--font-d);font-size:1.4rem;line-height:1}
.macros span{font-size:.72rem;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty .inp{text-align:center;font-size:1.3rem}
#scanbox{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column}
#scanbox .scan-top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;color:#fff}
#reader{flex:1;width:100%;overflow:hidden}
#reader video{object-fit:cover}
#scanbox .scan-msg{color:#ddd;text-align:center;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:.95rem}
/* plates */
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:9rem;padding:8px 0;overflow-x:auto}
.plates .barx{width:2.4rem;height:12px;border-radius:3px;background:var(--muted)}
.plates .sleeve{width:1.2rem;height:18px;border-radius:2px;background:var(--muted)}
.plate{width:16px;border-radius:4px;display:grid;place-items:center;font-size:.6rem;font-weight:800;color:#111;writing-mode:vertical-rl;flex:none}
/* photos */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:.7rem;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.ph.sel{outline:3px solid var(--accent);outline-offset:-3px}
.cmp{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--surface-2);max-width:100%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .top{clip-path:inset(0 50% 0 0)}
.cmp .divider{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%;box-shadow:0 0 6px rgba(0,0,0,.5)}
.cmp .lab{position:absolute;top:8px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
/* settings */
.set-sec{display:flex;flex-direction:column;gap:14px}
.set-sec h3{margin:0;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.opt{display:flex;flex-direction:column;gap:8px}
.ol{font-weight:600;font-size:.92rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:2.6rem;height:2.6rem;border-radius:999px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}
.sw.on{box-shadow:0 0 0 2px var(--fg)}
.sw .ic{width:1.1rem;height:1.1rem;opacity:0}
.sw.on .ic{opacity:1}
.sched{display:grid;grid-template-columns:3rem 1fr;gap:8px;align-items:center}
select,.textin{min-height:2.6rem;border-radius:var(--r-sm);border:1px solid var(--edge);background:var(--surface-2);padding:0 10px;width:100%;min-width:0}
textarea{width:100%;min-height:6rem;border-radius:var(--r-sm);border:1px solid var(--edge);background:var(--surface-2);padding:10px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
.lab-s{font-size:.75rem;color:var(--muted);display:block;margin-bottom:4px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{font-family:var(--font-d);font-weight:700;font-size:1.5rem;min-width:2.4rem;text-align:center}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left}
.tog{width:3rem;height:1.8rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--edge);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:1.45rem;height:1.45rem;border-radius:999px;background:var(--muted);transition:transform .2s}
.tog.on{background:var(--accent);border-color:var(--accent)}
.tog.on::after{transform:translateX(1.15rem);background:var(--accent-ink)}
.goalbox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.goalbox div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 4px}
.goalbox b{display:block;font-family:var(--font-d);font-size:1.3rem}
.goalbox span{font-size:.7rem;color:var(--muted)}
/* editor */
.erow{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r)}
.erow .top1{display:flex;align-items:center;gap:8px}
.erow .nm{font-weight:700;flex:1;min-width:0}
.erow .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.erow select{width:auto;flex:1}
/* celebrate */
.celebrate{text-align:center;align-items:center}
.celebrate .big{font-family:var(--font-d);font-weight:800;font-size:2.8rem;line-height:1;letter-spacing:-.02em;color:var(--accent-fg)}
.celebrate .badge.lg{animation:rise .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes rise{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.xpgain{font-family:var(--font-d);font-weight:800;font-size:2rem;color:var(--accent-fg)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
/* tabbar & toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:.7rem;font-weight:600;color:var(--muted)}
.tab.on{color:var(--accent-fg)}
.tab .ic{width:1.4rem;height:1.4rem}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:400;max-width:calc(100% - 32px);text-align:center}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);width:100%;text-align:left;font-weight:700}
html.no-motion *,html.no-motion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.hero .big{font-size:2.5rem}.rings.four{grid-template-columns:repeat(2,1fr)}}
.mini .rw .ic{width:1.35rem;height:1.35rem}
.card.lvl{flex-direction:row}
.wtot{font-family:var(--font-d);font-size:1.3rem;font-weight:700;white-space:nowrap}
/* ===== v3 additions ===== */
:root{--sil-line:#636366;--body:#2C2C2E;--mus-off:#3A3A3C;--shadow:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--sil-line:#1C1C1E;--body:#FFFFFF;--mus-off:#E3E3E8;--shadow:0 6px 24px rgba(0,0,0,.06)}}
:root[data-theme="light"]{--sil-line:#1C1C1E;--body:#FFFFFF;--mus-off:#E3E3E8;--shadow:0 6px 24px rgba(0,0,0,.06)}
html:root.t-black,html:root.t-dark{--sil-line:#636366;--body:#2C2C2E;--mus-off:#3A3A3C;--shadow:none}
html:root.t-dark{--body:#2B2B30;--mus-off:#3A3A40}
html:root.t-light{--sil-line:#1C1C1E;--body:#FFFFFF;--mus-off:#E3E3E8;--shadow:0 6px 24px rgba(0,0,0,.06)}
.card,.row,.ex,.lcard,.res,.erow,.qcard{box-shadow:var(--shadow)}
.greet{font-family:var(--font-d);font-weight:800;font-size:2.2rem;letter-spacing:-.02em;line-height:1.05}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.sec-h h2{margin:0;font-family:var(--font-d);font-weight:800;font-size:1.5rem;letter-spacing:-.01em}
.ghosty{background:transparent;border-color:transparent;color:var(--accent-fg)}
.wgoals{flex-direction:row;justify-content:space-around;gap:6px;padding:18px 10px}
.wring{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0;text-align:center}
.wring .rw{position:relative;width:5.2rem;height:5.2rem}
.wring .rw svg{width:100%;height:100%}
.wring .rw>span{position:absolute;inset:0;display:grid;place-items:center}
.wring .rw>span .ic{width:1.6rem;height:1.6rem}
.wring b{font-weight:700;font-size:1rem}
.mini .rw>span{position:absolute;inset:0;display:grid;place-items:center}
.closed{animation:closepop .6s ease-out}
@keyframes closepop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;border-radius:999px;color:var(--muted)}
.day .dn{font-size:.8rem}
.day b{font-family:var(--font-d);font-size:1.2rem;color:var(--fg)}
.day i{width:7px;height:7px;border-radius:999px;margin-top:2px}
.day .dot-f{background:var(--accent)}
.day .dot-r{border:1.6px solid var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel b{color:var(--accent-ink)}
.day.sel .dot-f{background:var(--accent-ink)}
.day.sel .dot-r{border-color:var(--accent-ink)}
.day.today:not(.sel) b{color:var(--accent-fg)}
.wcard{position:relative;overflow:hidden;min-height:9.5rem;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%)}
.wcard .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wcard .meta{color:var(--accent-fg);font-weight:600;font-size:.9rem}
.wcard .bg-ic{position:absolute;right:-18px;bottom:-26px;width:9rem;height:9rem;color:var(--accent);opacity:.1;pointer-events:none}
.wcard.rest{background:var(--surface)}
.card-t.lg{font-size:1.45rem;font-family:var(--font-d);font-weight:800}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(5.4rem + env(safe-area-inset-bottom,0px));z-index:25;width:3.6rem;height:3.6rem;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab .ic{width:1.6rem;height:1.6rem;stroke-width:2.6}
.spincard{flex-direction:row;align-items:center;text-align:left;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface))}
.qboard{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin-inline:-2px}
.qcard{scroll-snap-align:start;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qcard.done{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface))}
.qic{width:2.4rem;height:2.4rem;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface-2);color:var(--accent-fg)}
.gl{display:flex;justify-content:space-between;gap:8px}
.boss{border:1px solid color-mix(in srgb,var(--boss) 45%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--boss) 14%,var(--surface)),var(--surface))}
.hp{height:12px;border-radius:12px;background:var(--surface-2);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#FF453A,#FF9F0A);border-radius:12px;transition:width .6s}
.goal.me .gl span:first-child{color:var(--accent-fg);font-weight:700}
.profile{flex-direction:row;align-items:center;gap:14px}
.avwrap{width:6.2rem;flex:none}
.avatar{width:100%;height:auto;display:block}
.pname{font-family:var(--font-d);font-weight:800;font-size:1.6rem;line-height:1.1}
.titlebtn{display:inline-flex;align-items:center;gap:2px;color:var(--accent-fg);font-weight:600;font-size:.9rem}
.titlebtn .ic{width:.9rem;height:.9rem}
.freeze{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-sm);background:color-mix(in srgb,#64D2FF 14%,var(--surface-2))}
.trow{display:flex;gap:8px;align-items:flex-end;min-height:3.4rem}
.trophy{width:2.6rem;height:3.25rem;display:block}
.trophy.locked{opacity:.6}
.shelves{display:flex;flex-direction:column;gap:22px;perspective:600px}
.shelf .trs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 10px;position:relative;z-index:1}
.shelf .tr{display:grid;place-items:center;padding:6px 0 0;border-radius:var(--r-sm)}
.shelf .tr.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.shelf .tr .trophy{width:3.4rem;height:4.25rem;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.shelf .board{height:16px;margin-top:-4px;border-radius:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--fg) 22%,var(--surface-2)),var(--surface-2) 60%,color-mix(in srgb,#000 30%,var(--surface-2)));transform:rotateX(35deg);transform-origin:top;box-shadow:0 10px 14px rgba(0,0,0,.35)}
.trophy-info{flex-direction:row;align-items:center;gap:12px}
.trophy-info .trophy{width:3.6rem;height:4.5rem;flex:none}
.season{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface))}
.bigval{font-family:var(--font-d);font-weight:800;font-size:2rem;line-height:1.1}
.warnc{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.sslab{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--carb) 20%,transparent);color:var(--carb);vertical-align:middle}
.sslab.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.coach{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));font-size:.88rem}
.coach .ic{color:var(--accent-fg);width:1.05rem;height:1.05rem}
.ex .coach{margin-top:6px;padding:6px 10px}
.lcard.ss{border-left:4px solid var(--carb)}
.set[data-swipe]{touch-action:pan-y;transition:transform .15s}
.set.swiping .setdone{background:var(--accent);color:var(--accent-ink)}
.lt{font-family:var(--font-d);font-weight:800;font-size:1.5rem;line-height:1}
.rring{position:relative;width:3rem;height:3rem;flex:none}
.rring svg{width:100%;height:100%}
.rring .ic{position:absolute;inset:0;margin:auto;color:var(--accent-fg)}
.rring circle.bar{transition:stroke-dashoffset .25s linear}
.macrow{display:flex;align-items:center;gap:16px}
.donut{flex:none}
.dn-v{font-family:var(--font-d);font-weight:800;font-size:22px;fill:var(--fg)}
.dn-k{font-size:11px;fill:var(--muted)}
.legend2{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.legend2 .lg{display:grid;grid-template-columns:auto auto 1fr;gap:4px 8px;align-items:center}
.legend2 .lg b{font-family:var(--font-d);font-size:1.15rem}
.legend2 .lg .tiny{grid-column:2 / 4}
.bottle-row{display:flex;align-items:center;gap:16px}
#bottle{width:5.5rem;height:11rem;flex:none;touch-action:none;cursor:ns-resize}
#bottle-liq{transition:y .3s}
.map.big{max-width:340px;margin:0 auto;width:100%}
.flipper{position:relative;perspective:1200px}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1);aspect-ratio:220/386}
.flip-in.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face svg{width:100%;height:100%}
.face.back{transform:rotateY(180deg)}
.flipbtn{position:absolute;top:4px;left:4px;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface-2);color:var(--accent-fg);font-weight:700;font-size:.85rem;z-index:2}
.sil-o *{fill:var(--sil-line);stroke:var(--sil-line);stroke-width:7;stroke-linejoin:round}
.sil-i *{fill:var(--body);stroke:var(--body);stroke-width:5;stroke-linejoin:round}
.map .mus{stroke:var(--body);stroke-width:1.4}
.map .abl{stroke:var(--body)}
.legend i.lv{background:linear-gradient(90deg,var(--mus-off),var(--accent))}
.xpfly{position:fixed;z-index:500;pointer-events:none;font-family:var(--font-d);font-weight:800;font-size:1.3rem;color:var(--accent-fg);text-shadow:0 2px 10px rgba(0,0,0,.5);white-space:nowrap}
.xpbar.pulse i{animation:xpp .6s ease-out}
@keyframes xpp{0%{filter:brightness(1)}40%{filter:brightness(1.8)}100%{filter:brightness(1)}}
.flame{display:inline-grid;place-items:center;transition:transform .3s}
.flame .ic{width:1.15rem;height:1.15rem}
.flame.f0 .ic{color:var(--muted)}
.flame.f1 .ic{color:#FF9F0A}
.flame.f2 .ic{color:#FF9F0A;width:1.3rem;height:1.3rem}
.flame.f3 .ic{color:#FF6B2C;width:1.45rem;height:1.45rem;fill:color-mix(in srgb,#FF6B2C 30%,transparent)}
.flame.f4 .ic{color:#64D2FF;width:1.55rem;height:1.55rem;fill:color-mix(in srgb,#64D2FF 30%,transparent);filter:drop-shadow(0 0 6px #64D2FF)}
.flame.f5 .ic{color:#BF5AF2;width:1.65rem;height:1.65rem;fill:color-mix(in srgb,#BF5AF2 35%,transparent);filter:drop-shadow(0 0 8px #BF5AF2)}
.flame.f3,.flame.f4,.flame.f5{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
.lvup{font-family:var(--font-d);font-weight:800;font-size:1.9rem}
.cut .badge.lg{animation:rise .7s cubic-bezier(.2,.9,.3,1.3)}
.rankup{align-items:center;text-align:center;min-height:100%;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rk) 25%,transparent),transparent 60%)}
.ru-stage{position:relative;width:16rem;height:16rem;display:grid;place-items:center}
.rays{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite,fadein 1s .9s both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ru-old,.ru-new{position:absolute;display:grid;place-items:center}
.ru-old{animation:ruout .9s ease-in both}
.ru-new{animation:ruin .8s .85s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes ruout{0%{transform:scale(1);opacity:1}70%{transform:scale(1.1) rotate(-8deg);opacity:1}100%{transform:scale(.2) rotate(30deg);opacity:0}}
@keyframes ruin{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.ru-name{font-family:var(--font-d);font-weight:800;font-size:3.2rem;line-height:1;animation:fadein .6s 1.4s both}
.ru-t1{animation:fadein .6s 1.2s both}
.ru-t2{animation:fadein .6s 1.7s both}
.wheelbox{position:relative;width:min(80vw,18rem);aspect-ratio:1;margin:8px auto}
.wheel{width:100%;height:100%;display:block}
.wh-t{font-family:var(--font-d);font-weight:800;font-size:15px;fill:var(--fg)}
.wh-t.on{fill:var(--accent-ink)}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--fg);z-index:2}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtile{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;box-shadow:var(--shadow);min-height:7.5rem}
.qtile .ic{width:1.8rem;height:1.8rem}
.qtile b{font-size:1.05rem}
.qtile.wide{grid-column:1 / -1;min-height:auto}
.sh-story{background:#000}
.story{position:relative;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;color:#fff;--fg:#fff;--muted:#a1a1a6;--surface:#1c1c1e;--surface-2:#2c2c2e;--body:#2c2c2e;--mus-off:#3a3a3c;--sil-line:#636366}
.st-bars{display:flex;gap:4px}
.st-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:#fff}
.st-bars i.done b{width:100%}
.st-bars i.act b{animation:seg 6s linear forwards}
@keyframes seg{to{width:100%}}
.st-x{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:16px;z-index:5;background:rgba(255,255,255,.12);color:#fff;border:0}
.st-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:40px 4px;animation:fi .35s ease-out;position:relative;z-index:3;pointer-events:none}
.st-body button{pointer-events:auto}
.st-nav{position:absolute;top:60px;bottom:0;z-index:2}
.st-nav.l{left:0;width:35%}.st-nav.r{right:0;width:65%}.st-nav.short{bottom:40%}
.st-eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.st-big{font-family:var(--font-d);font-weight:800;font-size:2.4rem;line-height:1.1;text-wrap:balance}
.st-huge{font-family:var(--font-d);font-weight:800;font-size:6rem;line-height:.95}
.st-huge span{font-size:2.4rem;color:#a1a1a6}
.st-sub{color:#c7c7cc;font-size:1.1rem}
.st-row{display:flex;gap:18px}
.st-row div{display:flex;flex-direction:column;color:#a1a1a6;font-size:.9rem}
.st-row b{font-family:var(--font-d);font-size:1.8rem;color:#fff}
.st-row.big b{font-size:2.6rem}
.st-list{display:flex;flex-direction:column;gap:8px;font-size:1.05rem}
.st-mark .mark{width:5rem;height:5rem}
.tour{min-height:100%;justify-content:space-between}
.tour-dots{display:flex;gap:6px;justify-content:center;padding-top:8px}
.tour-dots i{width:7px;height:7px;border-radius:999px;background:var(--surface-2)}
.tour-dots i.on{background:var(--accent);width:22px}
.tour-body{display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;flex:1;justify-content:center;animation:fi .3s ease-out}
.tour-body h2{margin:0;font-family:var(--font-d);font-weight:800;font-size:2rem;letter-spacing:-.02em;text-wrap:balance}
.tour-body p{margin:0;max-width:34ch;line-height:1.5}
.tour-art{display:grid;place-items:center;min-height:9rem;width:100%}
.tour-art .mark{width:7rem;height:7rem}
.tour-art.big{font-family:var(--font-d);font-size:6rem;font-weight:800;color:var(--accent-fg)}
.mini-strip{width:100%;max-width:320px}
.mini-strip .day{padding:12px 0}
.map .flipbtn svg.ic,.flipbtn .ic{width:1rem;height:1rem}
.card.row{flex-direction:row;align-items:center}
.card.lvl{flex-direction:row}

function fxCtx(){const c=document.getElementById('confetti'),dpr=window.devicePixelRatio||1;if(c.width!==Math.round(innerWidth*dpr)||c.height!==Math.round(innerHeight*dpr)){c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr)}const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return x}

    if(FX.flash>0){x.fillStyle=`rgba(255,255,255,${FX.flash*.4})`;x.fillRect(0,0,innerWidth,innerHeight);FX.flash-=.05*dt}
    FX.bolts=FX.bolts.filter(b=>(b.life-=.03*dt)>0);FX.bolts.forEach(b=>{x.save();x.globalAlpha=Math.min(1,b.life*1.4);x.strokeStyle='#fff';x.shadowColor=b.c;x.shadowBlur=18;x.lineWidth=3;x.beginPath();b.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.lineWidth=1.2;x.strokeStyle=b.c;x.stroke();x.restore()});
    FX.P=FX.P.filter(p=>(p.life-=p.decay*dt)>0);
    FX.P.forEach(p=>{p.vy+=p.g*dt;p.vx*=Math.pow(p.drag,dt);p.vy*=Math.pow(p.drag,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;x.save();x.globalAlpha=Math.min(1,p.life);x.fillStyle=p.c;x.translate(p.x,p.y);
      if(p.k==='c'){x.rotate(p.r);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}else{x.beginPath();x.arc(0,0,p.s,0,7);x.fill()}x.restore()});

/* ===== Sheets (full-screen layers) ===== */
const top1=(title,sub,right='')=>`<div class="sheet-top"><button class="iconbtn" data-act="pop" aria-label="Back">${svg('back')}</button><div class="grow"><div class="t">${title}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>${right}</div>`;
function ssLabels(entries){const lab={};let ch=65;entries.forEach((e,i)=>{if(e.ss&&i<entries.length-1&&!lab[i]){const L=String.fromCharCode(ch++);lab[i]=L+'1';lab[i+1]=L+'2'}});return lab}

function shLogger(){
  const a=S.active,w=wobj(a.id),lab=ssLabels(a.entries);
  const total=a.entries.reduce((x,e)=>x+e.sets.length,0),done=a.entries.reduce((x,e)=>x+e.sets.filter(v=>v.done).length,0);
  const cards=a.entries.map((e,ei)=>{const L=lastFor(e.n),B=bestFor(e.n),info=exInfo(e.n),c=coach(e.n,e.reps),stuck=plateau(e.n);
    const base=e.sets[0].w!==''?+e.sets[0].w:(c&&c.w?c.w:(L?L.sets[0].w:0));
    const showWu=e.showWu!=null?e.showWu:(S.settings.warmups&&info.c&&ei<3),step=wStep();
    const wu=showWu?(base>0?[[.5,8],[.7,5],[.85,3]].map(([p,r],wi)=>{const wt=Math.max(0,Math.round(base*p/step)*step);return `<div class="set wu ${e.wu[wi]?'done':''}"><div class="sn">W${wi+1}</div><div class="wtxt num">${wt} ${U()} × ${r}</div><button class="setdone" data-act="wu-done" data-ei="${ei}" data-wi="${wi}" aria-label="Warm-up ${wi+1} done">${svg('check')}</button></div>`}).join(''):`<div class="tiny">Enter your set 1 weight to get warm-up sets. For bodyweight moves, do 5–8 easy reps first.</div>`):'';
    const rows=e.sets.map((v,si)=>{const Ls=L&&L.sets[si],f=compare(v,Ls,B);
      return `<div class="set ${v.done?'done':''} ${ui.popSet===ei+'-'+si?'pop':''}" data-swipe="1"><div class="sn">${si+1}</div>
        <div class="field"><input type="number" inputmode="decimal" id="w-${ei}-${si}" data-set="${ei},${si},w" value="${esc(v.w)}" placeholder="${c&&c.w?c.w:Ls?Ls.w:'0'}" aria-label="Weight, set ${si+1}"><span class="u">${U()}</span></div>
        <div class="field"><input type="number" inputmode="numeric" id="r-${ei}-${si}" data-set="${ei},${si},r" value="${esc(v.r)}" placeholder="${c?c.r:Ls?Ls.r:String(e.reps).split('–')[0]}" aria-label="Reps, set ${si+1}"><span class="u">reps</span></div>
        <button class="setdone" data-act="set-done" data-ei="${ei}" data-si="${si}" aria-label="Mark set ${si+1} done">${svg('check')}</button>
        <div class="flag ${f||''}" id="flag-${ei}-${si}">${f?FLAG[f]:''}</div></div>`}).join('');
    const complete=e.sets.every(v=>v.done),tipOpen=ui.tipsOpen[ei];
    return `<div class="lcard ${complete?'complete':''} ${lab[ei]?'ss':''}" id="card-${ei}"><div class="lhead"><div class="grow"><div class="t">${lab[ei]?`<span class="sslab">${lab[ei]}</span> `:''}${ei+1}. ${esc(e.n)}</div><div class="sub">${e.sets.length} × ${esc(e.reps)} reps · to failure${stuck?' · <span class="sslab warn">Stuck</span>':''}</div><div class="last">${L?`Beat this: <b class="num">${L.sets.map(setTxt).join(' · ')}</b>`:'First time. Set a baseline.'}</div></div>
      <button class="iconbtn sm" data-act="plates" data-ei="${ei}" aria-label="Plate calculator">${svg('calc')}</button><button class="iconbtn sm" data-act="swap-ex" data-ei="${ei}" aria-label="Swap exercise">${svg('swap')}</button></div>
      ${c?`<div class="coach">${svg('up')}<span class="grow">Coach: <b class="num">${c.w?c.w+' '+U()+' × ':''}${c.r}</b> · ${esc(c.why)}</span>${c.w?`<button class="chip" data-act="coach-use" data-ei="${ei}">Use</button>`:''}</div>`:''}
      <div class="btnrow"><button class="chip ${showWu?'on':''}" data-act="wu-toggle" data-ei="${ei}">Warm-up</button><button class="chip ${tipOpen?'on':''}" data-act="tips" data-ei="${ei}">Tips</button><button class="chip" data-act="set-add" data-ei="${ei}">${svg('plus')} Set</button>${e.sets.length>1?`<button class="chip" data-act="set-rem" data-ei="${ei}">${svg('minus')}</button>`:''}${ei<a.entries.length-1?`<button class="chip ${e.ss?'on':''}" data-act="ss-toggle" data-ei="${ei}">Superset ↓</button>`:''}</div>
      ${tipOpen?`<div class="rules">${tipsFor(e.n).map(t=>`<div class="rule">${svg('check')}<span>${esc(t)}</span></div>`).join('')}</div>`:''}
      <div class="sets">${wu}<div class="set set-h"><span>Set</span><span>Weight</span><span>Reps</span><span></span></div>${rows}</div></div>`}).join('');
  return `<div class="sheet-in">
    <div class="logtop"><button class="iconbtn" data-act="pop" aria-label="Minimize">${svg('back')}</button><div class="pring">${ring(done,total,64,6,'log-ring')}<b class="num">${Math.round(done/Math.max(1,total)*100)}%</b></div><div class="grow"><div class="lt">${esc(w.name)}</div><div class="sub num">${done}/${total} sets · <span id="elapsed">${mmss((Date.now()-a.start)/1000)}</span></div></div><button class="btn" data-act="finish">Finish</button></div>
    <div class="tiny" style="text-align:center">Tip: swipe a set to the right to finish it.</div>

    <button class="btn block ghost" data-act="add-ex-logger">${svg('plus')} Add exercise</button>
    <button class="btn block ${ui.confirm==='discard'?'danger':'ghost'}" data-act="discard">${ui.confirm==='discard'?'Tap again to discard workout':'Discard workout'}</button>
  </div>`;
}

function shSummary(sh){
  const s=S.sessions.find(x=>x.id===sh.sid);if(!s)return '<div class="sheet-in"></div>';
  const all=Object.values(s.entries).flat(),vol=all.reduce((a,x)=>a+x.w*x.r,0),mins=Math.max(1,Math.round((s.end-s.start)/60000));
  const b=sh.before,a=sh.after,up=a.L>b.L,rankUp=a.rank.n!==b.rank.n;
  const exList=Object.keys(s.entries).map(n=>({n,sets:s.entries[n].length}));
  return `<div class="sheet-in celebrate">
    <div class="big" style="margin-top:12px">Workout<br>complete</div><div class="sub">${esc(s.name)} · ${fmtD(fromKey(s.date))}</div>

    <section class="card" style="width:100%;align-items:center">
      <div class="xpgain num">+${fmtN(a.xp-b.xp)} XP</div>
      ${up?`${badge(a.rank,a.L,'lg')}<div class="lvup">LEVEL ${a.L}</div>${rankUp?`<button class="btn sm" data-act="rankup-show" data-from="${b.rank.n}" data-to="${a.rank.n}" data-l="${a.L}">See your new rank: ${a.rank.n}</button>`:''}`:`<div class="lvl" style="justify-content:center">${badge(a.rank,a.L)}<div><span class="ln">Level ${a.L}</span> <span class="rk" style="color:${a.rank.c}">${a.rank.n}</span></div></div>`}
      <div style="width:100%"><div class="xpbar"><i id="sum-xp" style="width:${up?0:Math.round(b.pct*100)}%" data-to="${Math.round(a.pct*100)}"></i></div><div class="tiny num" style="margin-top:6px">${fmtN(a.nxt-a.xp)} XP to Level ${a.L+1}</div></div></section>
    <section class="card" style="width:100%;text-align:left"><div class="card-t">Muscles you hit</div><div class="map">${bodyMap(targetFill(exList))}</div></section>
    <button class="btn block" data-act="summary-done">Done</button></div>`;
}

function shRankUp(sh){const nr=RANKS.find(r=>r.n===sh.to)||RANKS[0],or=RANKS.find(r=>r.n===sh.from)||RANKS[0];

function shExercise(sh){
  const n=sh.name,hist=S.sessions.filter(s=>s.entries[n]&&s.entries[n].length).map(s=>{const sets=s.entries[n],best=sets.reduce((m,y)=>e1rm(y.w,y.r)>e1rm(m.w,m.r)?y:m);return{s,sets,best,e:e1rm(best.w,best.r),top:Math.max(...sets.map(x=>x.w)),vol:sets.reduce((a,x)=>a+x.w*x.r,0)}});
  const metric=sh.metric||'e1rm',B=bestFor(n),info=exInfo(n),c=coach(n,'8–12'),stuck=plateau(n);
  const pts=hist.map(h=>({x:h.s.end||fromKey(h.s.date).getTime(),y:metric==='e1rm'?r1(h.e):metric==='top'?h.top:h.vol})).sort((a,b)=>a.x-b.x);

function plateRows(total){const s=S.settings,lb=U()==='lb',bar=+s.bar||0,plates=lb?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25];
  const colors=lb?{45:'#3D7BF0',35:'#F2C440',25:'#3CC56A',10:'#E8EDF2',5:'#F05454',2.5:'#9AA3AD'}:{25:'#F05454',20:'#3D7BF0',15:'#F2C440',10:'#3CC56A',5:'#E8EDF2',2.5:'#5A5F66',1.25:'#C5CDD6'};
  if(!(total>0))return '<div class="empty-note">Enter a total weight.</div>';
  if(total<bar)return `<div class="empty-note">That’s less than the ${bar} ${U()} bar.</div>`;
  let side=(total-bar)/2;const used=[];plates.forEach(p=>{while(side>=p-1e-9){used.push(p);side-=p}});
  const vis=used.map(p=>`<div class="plate" style="background:${colors[p]};height:${Math.round(40+80*p/plates[0])}px">${p}</div>`).join('');
  return `<div class="plates"><div class="barx"></div>${vis}<div class="sleeve"></div></div><div class="card-t" style="text-align:center">${used.length?'Each side: '+used.join(' + ')+' '+U():'Just the bar'}</div>
    ${side>0.01?`<div class="tiny" style="text-align:center">${r1(side*2)} ${U()} can’t be made with standard plates. Closest: ${r1(total-side*2)} ${U()}</div>`:''}`}

function commit(opts={}){
  save();let ch=false;const st=streaks();
  if(st.train>S.best.train){S.best.train=st.train;ch=true}
  if(st.daily>S.best.daily){S.best.daily=st.daily;ch=true}
  const un=achUnlocked(),fresh=un.filter(id=>!S.achSeen[id]);
  if(fresh.length){fresh.forEach(id=>S.achSeen[id]=dkey());ch=true;if(!opts.quiet&&S.seenLevel){toast('Trophy unlocked: '+fresh.map(id=>ACH.find(a=>a.id===id).n).join(', ')+' · +50 XP');celebrate('small')}}
  if(ch)save();
  const li=levelInfo();
  if(!S.seenLevel){S.seenLevel=li.L;S.seenRank=li.rank.n;save()}
  else if(li.L>S.seenLevel){const prev=S.seenLevel,prevRank=S.seenRank||levelInfo(lvlXP(prev)).rank.n;S.seenLevel=li.L;S.seenRank=li.rank.n;save();
    if(!opts.quiet&&!ui.stack.some(x=>x.type==='summary')){ui.stack.push(prevRank!==li.rank.n?{type:'rankup',from:prevRank,to:li.rank.n,l:li.L}:{type:'levelup',from:prev,to:li.L});celebrate('big')}}
  else if(li.rank.n!==S.seenRank&&li.L>=S.seenLevel){S.seenRank=li.rank.n;save()}
  const xp=totalXP(),gain=lastXP!=null?xp-lastXP:0;lastXP=xp;
  render();if(gain>0&&!opts.noFly)flyXP(gain);
}

function startWorkout(dow){
  if(!S.active){const id=wid(dow);
    S.active={id,dow,start:Date.now(),date:dkey(),entries:exercisesFor(dow,id).map(e=>({n:e.n,reps:e.reps,ss:!!e.ss,wu:[false,false,false],sets:Array.from({length:e.sets},()=>({w:'',r:'',done:false}))}))};
    save()}
  ui.stack=ui.stack.filter(s=>s.type!=='logger'&&s.type!=='quick');push('logger');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wake=l).catch(()=>{})}catch(e){}
}
function finishWorkout(){
  const a=S.active,entries={},prs=[];let beats=0,count=0;
  a.entries.forEach(e=>{const L=lastFor(e.n),B=bestFor(e.n);let isPR=false;const sets=[];
    e.sets.forEach((v,i)=>{if(v.w!==''&&v.r!==''){const c=compare(v,L&&L.sets[i],B);if(c==='beat'||(c==='pr'&&L))beats++;if(c==='pr')isPR=true;sets.push({w:+v.w,r:+v.r})}});
    if(sets.length){entries[e.n]=(entries[e.n]||[]).concat(sets);count+=sets.length;if(isPR&&!prs.includes(e.n))prs.push(e.n)}});
  if(!count){toast('Log at least one set with weight and reps to save.');return}
  const before=levelInfo();
  const s={id:Date.now().toString(36),date:a.date,dow:a.dow,wid:a.id,name:wobj(a.id).name,start:a.start,end:Date.now(),entries,beats,prs};
  S.sessions.push(s);const h=S.habits[a.date]||(S.habits[a.date]={});h[2]=true;
  S.active=null;rest.end=0;try{wake&&wake.release()}catch(e){}
  save();const after=levelInfo();S.seenLevel=Math.max(S.seenLevel,after.L);S.seenRank=after.rank.n;
  ui.stack=[{type:'summary',sid:s.id,before,after}];ui.tab='home';ui.homeDay=null;
  commit({quiet:true,noFly:true});
  if(beats||prs.length||after.L>before.L)celebrate(after.L>before.L||prs.length?'big':'small');
}
function beep(){try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=880;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(audio.destination);o.start();o.stop(t+.55)}catch(e){}}
function tick(){
  const el=document.getElementById('elapsed');if(el&&S.active)el.textContent=mmss((Date.now()-S.active.start)/1000);
  const bar=document.getElementById('restbar');if(!bar)return;
  if(!rest.end){bar.hidden=true;return}
  const left=(rest.end-Date.now())/1000;
  if(left<=0){rest.end=0;bar.hidden=true;beep();toast('Rest over. Next set.');return}
  bar.hidden=false;document.getElementById('rest-time').textContent=mmss(left);
  const c=bar.querySelector('circle.bar');if(c){const len=+c.getAttribute('stroke-dasharray');c.style.strokeDashoffset=String(len*(1-left/rest.total))}
}

const SCAN_LIB='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
function loadScanLib(){if(window.Html5Qrcode)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src=SCAN_LIB;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
const scanFormats=()=>{const F=window.Html5QrcodeSupportedFormats;return F?[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E]:undefined};
async function startScan(){
  try{await loadScanLib()}catch(e){toast('Couldn’t load the scanner. Check your internet connection.');return}
  document.getElementById('scanbox').hidden=false;
  scanner=new Html5Qrcode('reader',{formatsToSupport:scanFormats(),verbose:false});
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.85,340)),height:Math.floor(Math.min(h*.3,170))})},code=>{stopScan();lookupBarcode(code)},()=>{})}
  catch(e){stopScan();toast('Camera unavailable. Allow camera access in Settings, or scan a photo instead.')}
}
async function stopScan(){const box=document.getElementById('scanbox');if(scanner){const s=scanner;scanner=null;try{if(s.isScanning)await s.stop();s.clear()}catch(e){}}box.hidden=true}
async function scanFile(file){
  try{await loadScanLib()}catch(e){toast('Couldn’t load the scanner. Check your internet connection.');return}
  const t=new Html5Qrcode('reader-file',{formatsToSupport:scanFormats(),verbose:false});
  try{const code=await t.scanFile(file,false);lookupBarcode(code)}catch(e){toast('No barcode found. Try a closer, sharper photo.')}finally{try{t.clear()}catch(e){}}
}
function fetchJSON(url,ms=10000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).then(r=>{clearTimeout(t);if(!r.ok)throw new Error('http');return r.json()})}
function parseOFF(p){if(!p)return null;const n=p.nutriments||{};
  let k=n['energy-kcal_100g'];if(k==null&&n['energy_100g']!=null)k=n['energy_100g']/4.184;
  const h=k!=null?{k:+k,p:+(n.proteins_100g||0),c:+(n.carbohydrates_100g||0),f:+(n.fat_100g||0)}:null;
  let s=null;const g=parseFloat(p.serving_quantity);
  if(h&&g>0)s={label:p.serving_size||g+' g',g,k:h.k*g/100,p:h.p*g/100,c:h.c*g/100,f:h.f*g/100};
  else if(n['energy-kcal_serving']!=null)s={label:p.serving_size||'1 serving',g:0,k:+n['energy-kcal_serving'],p:+(n.proteins_serving||0),c:+(n.carbohydrates_serving||0),f:+(n.fat_serving||0)};
  if(!h&&!s)return null;
  return{name:(p.product_name||'').trim()||'Unnamed product',brand:(p.brands||'').split(',')[0].trim(),src:'off',s,h}}
async function lookupBarcode(code){
  toast('Looking up '+code+'…');
  const get=c=>fetchJSON(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(c)}.json?fields=product_name,brands,nutriments,serving_size,serving_quantity`).then(j=>j&&j.status===1?parseOFF(j.product):null).catch(()=>undefined);
  let it=await get(code);if(!it&&code.length===12)it=await get('0'+code);
  const sh=top();if(!sh||sh.type!=='food')return;
  if(it)pickFood(sh,it);else{sh.tab='manual';render();toast(it===undefined?'Couldn’t reach the food database. Check your connection.':'That product isn’t in the database yet. Add it manually.')}
}
function pickFood(sh,it){sh.item=it;const last=it.last;sh.unit=last&&(last.unit==='g'||it.s)?last.unit:(it.s?'srv':'g');sh.qty=last?last.qty:(sh.unit==='srv'?1:100);render()}
function searchOFF(q){
  foodRes.loading=true;foodRes.err='';updateFoodRes();
  fetchJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=code,product_name,brands,nutriments,serving_size,serving_quantity`,12000)
    .then(j=>{if(foodRes.q!==q)return;foodRes.off=(j.products||[]).map(parseOFF).filter(Boolean);foodRes.loading=false;updateFoodRes()})
    .catch(()=>{if(foodRes.q!==q)return;foodRes.loading=false;foodRes.off=[];foodRes.err='Couldn’t reach the food database. Common foods and recent items still work offline.';updateFoodRes()});
}
function updateFoodRes(){const el=document.getElementById('food-res');if(el)el.innerHTML=foodResultsHTML()}
function addFoodEntry(meal,it,unit,qty){
  const m=calcItem(it,unit,qty),k=dkey();
  const label=unit==='srv'?(+qty===1?it.s.label:`${r1(qty)} × ${it.s.label}`):`${r1(qty)} g`;
  (S.foods[k]||(S.foods[k]=[])).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),meal,name:it.name,brand:it.brand||'',unit,qty:+qty,label,k:m.k,p:m.p,c:m.c,f:m.f,ts:Date.now()});
  const rec={name:it.name,brand:it.brand||'',src:it.src==='common'?'common':'recent',s:it.s,h:it.h,last:{unit,qty:+qty}};
  S.recentFoods=[rec,...S.recentFoods.filter(f=>!(f.name===it.name&&f.brand===(it.brand||'')))].slice(0,30);
}

/* photos (IndexedDB) */
const idb=(()=>{let dbp=null;const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('levelup',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(mode,fn)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('photos',mode),req=fn(t.objectStore('photos'));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error)}));
  return{all:()=>tx('readonly',s=>s.getAll()),put:p=>tx('readwrite',s=>s.put(p)),del:id=>tx('readwrite',s=>s.delete(id))}})();
function loadPhotos(){idb.all().then(list=>{photos=(list||[]).map(p=>({id:p.id,date:p.date,pose:p.pose,url:URL.createObjectURL(p.blob)}));if(ui.tab==='body'||ui.stack.some(s=>s.type==='compare'))render()}).catch(()=>{})}
function downscale(file,max=1100){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}
async function addPhoto(file){
  try{const blob=await downscale(file),p={id:Date.now().toString(36),date:dkey(),pose:ui.pose,blob};await idb.put(p);
    photos.push({id:p.id,date:p.date,pose:p.pose,url:URL.createObjectURL(blob)});S.photoDays[p.date]=(S.photoDays[p.date]||0)+1;commit();toast('Photo saved')}
  catch(e){toast('Couldn’t save that photo. Try another one.')}
}

/* ---------- Clicks ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;

  if(!['discard','reset','ed-reset','ed-delete','photo-del'].includes(act))ui.confirm=null;

    case 'tab':ui.tab=d.tab;ui.detail=null;ui.stack=ui.stack.filter(x=>x.type==='logger'&&false);render();window.scrollTo(0,0);break;
    case 'pop':pop();break;

    case 'habit':{const h=S.habits[k]||(S.habits[k]={});h[d.i]=!h[d.i];commit();break}
    case 'water-add':(S.water[k]||(S.water[k]=[])).push(Date.now());commit();toast(`Logged ${s.bottle} oz`);break;
    case 'water-del':(S.water[k]||[]).splice(+d.i,1);commit();break;
    case 'water-toggle':ui.waterOpen=!ui.waterOpen;render();break;
    case 'steps-add':S.steps[k]=(S.steps[k]||0)+(+d.n);commit();break;
    case 'steps-set':{const v=parseInt(document.getElementById('steps-in').value,10);if(!(v>=0)){toast('Enter your total steps for today.');break}S.steps[k]=v;commit();toast('Steps updated');break}
    case 'day':ui.homeDay=+d.dow;render();break;
    case 'detail':ui.tab='train';ui.detail=+d.dow;ui.stack=[];render();window.scrollTo(0,0);break;
    case 'detail-close':ui.detail=null;render();break;
    case 'start':if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(err){}}startWorkout(+d.dow);break;
    case 'open-logger':ui.stack=ui.stack.filter(x=>x.type!=='logger');push('logger');break;
    case 'set-done':{const ei=+d.ei,si=+d.si,en=S.active.entries[ei],v=en.sets[si];v.done=!v.done;v.t=Date.now();
      if(v.done){try{audio&&audio.state==='suspended'&&audio.resume()}catch(err){}ui.popSet=ei+'-'+si;
        const next=S.active.entries[ei+1];
        if(en.ss&&next){rest.end=0;toast('Superset: go to '+next.n);scrollToCard=ei+1}else{rest.total=s.rest;rest.end=Date.now()+s.rest*1000}
        const L=lastFor(en.n),c=compare(v,L&&L.sets[si],bestFor(en.n));
        if(c==='pr'){celebrate('small');toast('New PR on '+en.n+'!')}else if(c==='beat'){burst(lastTap.x,lastTap.y);toast('Beat last time!')}}
      save();render();break}
    case 'wu-done':{const en=S.active.entries[+d.ei];en.wu[+d.wi]=!en.wu[+d.wi];save();render();break}
    case 'wu-toggle':{const ei=+d.ei,en=S.active.entries[ei],info=exInfo(en.n);const cur=en.showWu!=null?en.showWu:(s.warmups&&info.c&&ei<3);en.showWu=!cur;save();render();break}
    case 'tips':ui.tipsOpen[d.ei]=!ui.tipsOpen[d.ei];render();break;
    case 'ss-toggle':{const en=S.active.entries[+d.ei];en.ss=!en.ss;save();render();break}
    case 'coach-use':{const en=S.active.entries[+d.ei],c=coach(en.n,en.reps);if(c){en.sets.forEach(v=>{if(!v.done)v.w=String(c.w)});save();render();toast('Filled in '+c.w+' '+U())}break}
    case 'set-add':{const en=S.active.entries[+d.ei];en.sets.push({w:'',r:'',done:false});save();render();break}
    case 'set-rem':{const en=S.active.entries[+d.ei];if(en.sets.length>1)en.sets.pop();save();render();break}
    case 'plates':{const en=S.active.entries[+d.ei];const v=en.sets.find(x=>x.w!=='');const L=lastFor(en.n);push('plates',{weight:v?v.w:(L?L.sets[0].w:'')});break}
    case 'swap-ex':{const ei=+d.ei,n=S.active.entries[ei].n;push('picker',{mode:'swap',target:'logger',idx:ei,orig:n,group:exGroup(n),always:false});break}
    case 'add-ex-logger':push('picker',{mode:'add',target:'logger'});break;
    case 'rest-add':if(rest.end){rest.end+=(+d.s)*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);tick()}break;
    case 'rest-skip':rest.end=0;tick();break;
    case 'finish':finishWorkout();break;
    case 'discard':if(ui.confirm==='discard'){S.active=null;ui.confirm=null;rest.end=0;ui.stack=ui.stack.filter(x=>x.type!=='logger');save();render();toast('Workout discarded')}else{ui.confirm='discard';render()}break;
    case 'summary-done':ui.stack=[];render();window.scrollTo(0,0);break;
    case 'rankup-show':push('rankup',{from:d.from,to:d.to,l:+d.l});celebrate('big');break;
    case 'week':ui.week=Math.min(0,ui.week+(+d.d));render();break;
    case 'map':ui.mapSel=ui.mapSel===d.m?null:d.m;render();break;
    case 'map-mode':ui.mapMode=d.m;ui.mapSel=null;render();break;
    case 'flip':{ui.flip=!ui.flip;const f=document.getElementById('flip-in');if(f)f.classList.toggle('flipped',ui.flip);const l=document.getElementById('flip-lab');if(l)l.textContent=ui.flip?'Back':'Front';break}
    case 'exercise':push('exercise',{name:d.n,metric:'e1rm'});break;
    case 'ex-metric':sh.metric=d.m;render();break;
    case 'share-pr':{let x=null,date=dkey();if(d.sid){const ss=S.sessions.find(q=>q.id===d.sid);if(ss&&ss.entries[d.n]){x=ss.entries[d.n].reduce((m,y)=>e1rm(y.w,y.r)>e1rm(m.w,m.r)?y:m);date=ss.date}}else{const B=bestFor(d.n);if(B){x=B;date=B.date}}
      if(x)shareCard('pr',{name:d.n,w:x.w,r:x.r,date});break}
    /* editor */
    case 'edit-workout':push('editor',{wid:d.id,isNew:false,draft:JSON.parse(JSON.stringify(S.workouts[d.id]))});break;
    case 'new-workout':push('editor',{wid:null,isNew:true,draft:{name:'',sub:'Custom',focus:'',ex:[]}});break;
    case 'ed-move':{const i=+d.i,j=i+(+d.d),x=sh.draft.ex;if(j>=0&&j<x.length){[x[i],x[j]]=[x[j],x[i]];render()}break}
    case 'ed-sets':{const x=sh.draft.ex[+d.i];x.sets=clamp(x.sets+(+d.d),1,8);render();break}
    case 'ed-del':sh.draft.ex.splice(+d.i,1);render();break;
    case 'ed-ss':{const x=sh.draft.ex[+d.i];x.ss=!x.ss;render();break}
    case 'ed-swap':{const n=sh.draft.ex[+d.i].n;push('picker',{mode:'swap',target:'editor',idx:+d.i,orig:n,group:exGroup(n)});break}
    case 'ed-add':push('picker',{mode:'add',target:'editor'});break;
    case 'ed-save':{const dr=sh.draft;dr.name=(document.getElementById('ed-name').value||'').trim();dr.focus=(document.getElementById('ed-focus').value||'').trim();
      if(!dr.name){toast('Give the workout a name.');break}if(!dr.ex.length){toast('Add at least one exercise.');break}

      toast(sh.isNew?'Workout created. Put it on a day in Settings → Weekly schedule.':'Workout saved');commit();break}
    case 'ed-reset':if(ui.confirm==='ed-reset'){sh.draft=JSON.parse(JSON.stringify(DEFAULT_WORKOUTS()[sh.wid]));ui.confirm=null;render()}else{ui.confirm='ed-reset';render()}break;
    case 'ed-delete':if(ui.confirm==='ed-delete'){delete S.workouts[sh.wid];for(const x in s.schedule)if(s.schedule[x]===sh.wid)s.schedule[x]='rest';ui.stack.pop();ui.confirm=null;ui.detail=null;commit();toast('Workout deleted')}else{ui.confirm='ed-delete';render()}break;
    /* picker */
    case 'pick-group':sh.group=d.g;render();break;
    case 'pick-always':sh.always=!sh.always;render();break;
    case 'pick-ex':pickExercise(sh,d.n);break;
    case 'cx-mus':{const m=d.m;sh.newMus=sh.newMus||[];sh.newMus=sh.newMus.includes(m)?sh.newMus.filter(x=>x!==m):sh.newMus.concat(m);render();break}
    case 'cx-comp':sh.newC=!sh.newC;render();break;
    case 'cx-create':{const name=(document.getElementById('cx-name').value||'').trim();if(!name){toast('Name the exercise first.');break}if(!(sh.newMus||[]).length){toast('Pick at least one muscle.');break}
      const m={};sh.newMus.forEach((x,i)=>m[x]=i===0?1:.5);S.customEx[name]={m,c:!!sh.newC};save();pickExercise(sh,name);break}
    /* food */
    case 'food-open':foodRes.q='';foodRes.off=[];foodRes.err='';ui.stack=ui.stack.filter(x=>x.type!=='quick');push('food',{meal:d.meal||autoMeal(),tab:d.tab||'search',item:null});break;
    case 'food-tab':sh.tab=d.t;render();break;
    case 'food-pick':{const i=+d.i,it=d.src==='off'?foodRes.off[i]:d.src==='rec'?sh._rec[i]:sh._com[i];if(it)pickFood(sh,it);break}
    case 'food-unit':{const u=d.u;if(u!==sh.unit){sh.unit=u;sh.qty=u==='srv'?1:(sh.item.s&&sh.item.s.g?Math.round(sh.item.s.g):100)}render();break}
    case 'food-qty':{const st=sh.unit==='srv'?.5:10;sh.qty=Math.max(0,r1((+document.getElementById('food-qty').value||0)+st*(+d.d)));render();break}
    case 'food-meal':sh.meal=d.m;render();break;
    case 'food-add':{sh.qty=+document.getElementById('food-qty').value||0;if(!(sh.qty>0)){toast('Enter an amount.');break}addFoodEntry(sh.meal,sh.item,sh.unit,sh.qty);ui.stack.pop();commit();toast('Added '+sh.item.name);break}
    case 'food-manual':{const v=id=>+(document.getElementById(id).value)||0,name=(document.getElementById('m-name').value||'').trim()||'Quick add',kc=v('m-k');
      if(!(kc>0)&&!(v('m-p')>0)){toast('Enter at least calories or protein.');break}
      addFoodEntry(sh.meal,{name,brand:'',src:'manual',s:{label:'1 serving',g:0,k:kc||v('m-p')*4+v('m-c')*4+v('m-f')*9,p:v('m-p'),c:v('m-c'),f:v('m-f')},h:null},'srv',1);ui.stack.pop();commit();toast('Added '+name);break}
    case 'food-del':{const list=S.foods[k]||[];const i=list.findIndex(x=>x.id===d.id);if(i>=0)list.splice(i,1);commit();break}
    case 'meal-save':push('savemeal',{meal:d.meal});break;
    case 'meal-save-do':{const items=(S.foods[k]||[]).filter(x=>x.meal===d.meal).map(({id,ts,meal,...r})=>r),name=(document.getElementById('sm-name').value||'').trim()||'My meal';
      S.savedMeals.push({id:Date.now().toString(36),name,items});save();ui.stack.pop();render();toast('Saved “'+name+'”');break}
    case 'savedmeal-add':{const m=S.savedMeals[+d.i];if(!m)break;const list=S.foods[k]||(S.foods[k]=[]);m.items.forEach(x=>list.push({...x,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),meal:sh.meal,ts:Date.now()}));ui.stack.pop();commit();toast('Added '+m.name);break}

    case 'pose':ui.pose=d.p;render();break;
    case 'photo-open':{const ph=photos.slice().sort((a,c)=>a.date.localeCompare(c.date)||a.id.localeCompare(c.id));const same=ph.filter(p=>p.pose===(photos.find(x=>x.id===d.id)||{}).pose);push('compare',{a:(same[0]||ph[0]).id,b:d.id,pos:50});break}
    case 'photo-del':if(ui.confirm==='ph-del'){const id=d.id,p=photos.find(x=>x.id===id);idb.del(id).catch(()=>{});if(p){URL.revokeObjectURL(p.url);photos=photos.filter(x=>x.id!==id);if(S.photoDays[p.date]>1)S.photoDays[p.date]--;else delete S.photoDays[p.date]}ui.confirm=null;ui.stack.pop();commit();toast('Photo deleted')}else{ui.confirm='ph-del';render()}break;
    /* cardio, quick log, spin */

    case 'cd-type':sh.ct=d.t;render();break;

    case 'cd-int':sh.int=d.v;render();break;

  }
});
function pickExercise(sh,n){
  const below=ui.stack[ui.stack.length-2];
  if(sh.target==='editor'&&below&&below.type==='editor'){const ex=below.draft.ex;if(sh.mode==='swap')ex[sh.idx]={...ex[sh.idx],n};else ex.push(EX(n,2,'8–12'))}
  else if(sh.target==='logger'&&S.active){
    if(sh.mode==='swap'){const en=S.active.entries[sh.idx],orig=en.n;en.n=n;en.sets.forEach(v=>{v.w='';v.r='';v.done=false});en.showWu=undefined;
      if(sh.always){const w=S.workouts[S.active.id];if(w){const j=w.ex.findIndex(x=>x.n===orig);if(j>=0)w.ex[j]={...w.ex[j],n}}}}
    else S.active.entries.push({n,reps:'8–12',ss:false,wu:[false,false,false],sets:[{w:'',r:'',done:false},{w:'',r:'',done:false}]});
    save()}
  ui.stack.pop();render();toast((sh.mode==='swap'?'Swapped to ':'Added ')+n);
}

/* ---------- Inputs ---------- */
document.addEventListener('input',e=>{
  const t=e.target,sh=top();
  if(t.dataset.set&&S.active){const [ei,si,f]=t.dataset.set.split(',');const en=S.active.entries[+ei],v=en.sets[+si];v[f]=t.value;save();
    const L=lastFor(en.n),r=compare(v,L&&L.sets[+si],bestFor(en.n)),fl=document.getElementById(`flag-${ei}-${si}`);if(fl){fl.className='flag '+(r||'');fl.textContent=r?FLAG[r]:''}}
  else if((t.id==='ed-name'||t.id==='ed-focus')&&sh&&sh.draft)sh.draft[t.id==='ed-name'?'name':'focus']=t.value;
  else if(t.id==='cx-name'&&sh)sh.newName=t.value;
  else if(t.id==='pick-q'&&sh){sh.q=t.value;document.getElementById('pick-list').innerHTML=pickerList(sh)}
  else if(t.id==='food-q'){foodRes.q=t.value.trim();foodRes.off=[];foodRes.err='';clearTimeout(searchTimer);
    if(foodRes.q.length>=3){foodRes.loading=true;searchTimer=setTimeout(()=>searchOFF(foodRes.q),550)}else foodRes.loading=false;updateFoodRes()}
  else if(t.id==='food-qty'&&sh&&sh.item){sh.qty=+t.value||0;document.getElementById('food-prev').innerHTML=macroBoxes(calcItem(sh.item,sh.unit,sh.qty))}
  else if(t.id==='plate-w'&&sh){sh.weight=t.value;document.getElementById('plate-out').innerHTML=plateRows(+t.value)}
  else if(t.id==='cmp-r'&&sh){sh.pos=+t.value;document.getElementById('cmp-top').style.clipPath=`inset(0 ${100-sh.pos}% 0 0)`;document.getElementById('cmp-div').style.left=sh.pos+'%'}
  else if((t.id==='cd-min'||t.id==='cd-dist')&&sh){sh[t.id==='cd-min'?'min':'dist']=t.value;const el=document.getElementById('cd-kcal');if(el)el.textContent=`About ${cardioKcal(sh.ct,+sh.min||0,sh.int)} kcal burned (estimate)`}
  else if(t.id==='appname'){S.settings.name=t.value.trim()||'Level Up';save();document.title=S.settings.name}
  else if(t.id==='username'){S.settings.userName=t.value.trim();save()}
});
document.addEventListener('change',e=>{
  const t=e.target,s=S.settings,p=s.profile,sh=top();
  if(t.dataset.sched){s.schedule[t.dataset.sched]=t.value;commit({noFly:true})}
  else if(t.dataset.edreps!=null&&sh&&sh.draft){sh.draft.ex[+t.dataset.edreps].reps=t.value}
  else if(t.id==='appname'||t.id==='username')render();
  else if(t.id==='quotes-in'){s.quotes=t.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,50);save()}
  else if(t.id==='pf-age'){p.age=clamp(parseInt(t.value,10)||0,0,100)||'';commit({noFly:true})}
  else if(t.id==='pf-w'){const v=parseFloat(t.value);p.kg=v>0?dispToKg(v):'';commit({noFly:true})}
  else if(t.id==='pf-ft'||t.id==='pf-in'){const ft=+document.getElementById('pf-ft').value||0,inch=+document.getElementById('pf-in').value||0;p.cm=ft||inch?(ft*12+inch)*2.54:'';commit({noFly:true})}
  else if(t.id==='pf-cm'){p.cm=+t.value||'';commit({noFly:true})}
  else if(/^g-[kpcf]$/.test(t.id)){s.goals[t.id[2]]=Math.max(0,+t.value||0);commit({noFly:true})}
  else if(t.id==='photo-in'&&t.files&&t.files[0]){addPhoto(t.files[0]);t.value=''}
  else if(t.id==='scan-file'&&t.files&&t.files[0]){scanFile(t.files[0]);t.value=''}
  else if((t.id==='cmp-a'||t.id==='cmp-b')&&sh){sh[t.id==='cmp-a'?'a':'b']=t.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target;if(t.id==='steps-in'){const b=document.querySelector('[data-act="steps-set"]');if(b)b.click()}else if(t.id==='bw-in'){const b=document.querySelector('[data-act="bw-log"]');if(b)b.click()}}});
document.addEventListener('animationend',e=>{if(e.target.matches&&e.target.matches('.st-bars i.act b')){const sh=top();if(sh&&sh.type==='story'){const n=storySlides(sh.off).slides.length;if((sh.i||0)<n-1){sh.i++;render()}}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!(document.activeElement&&document.activeElement.matches('input,textarea,select'))&&!(top()&&top().type==='story')){ver++;render()}});

/* ---------- Init ---------- */
lastXP=totalXP();
if(!S.onboarded)ui.stack.push({type:'tour',i:0});
render();
if(!S.seenLevel)commit({quiet:true,noFly:true});
loadPhotos();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}

})();
</script>
</body>
